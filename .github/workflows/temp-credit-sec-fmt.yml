name: Temporary secure fixture formatting snapshot
on:
  push:
    branches:
      - feat/source-credit-adapters-209
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: |
          set -euo pipefail
          pnpm exec prettier --write packages/knowledge/src/source-credit-adapters.test.ts
          echo '### BEGIN FORMATTED FIXTURE TEST'
          base64 -w0 packages/knowledge/src/source-credit-adapters.test.ts
          echo
          echo '### END FORMATTED FIXTURE TEST'
          pnpm --filter @oratlas/knowledge typecheck
          pnpm exec vitest run packages/knowledge/src/source-credit-adapters.test.ts
