name: Materialize BYOK OpenAPI routes

on:
  push:
    branches:
      - agent/byok-governed-ai-workflows

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Insert API route contracts
        run: node scripts/patch-byok-openapi.mjs
      - name: Commit generated contract
        run: |
          if git diff --quiet -- docs/openapi.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml
          git commit -m "docs(api): document governed AI workflows"
          git push
