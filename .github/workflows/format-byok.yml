name: Materialize BYOK formatting

on:
  push:
    branches:
      - agent/byok-governed-ai-workflows

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed AI files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/editorial/NodeEdgeProposalPanel.tsx \
            apps/web/src/components/AiIngestionExtractionPanel.tsx \
            apps/web/src/components/ExploreDiscuss.tsx \
            apps/web/src/components/LlmCredentialPanel.tsx \
            apps/web/src/lib/ai-ingestion-extraction.ts \
            apps/web/src/lib/llm-credential-token.test.ts \
            apps/web/src/lib/llm-credential-token.ts \
            apps/web/src/lib/llm-credentials.ts \
            packages/knowledge/src/graph-curation.test.ts \
            packages/knowledge/src/graph-curation.ts \
            packages/knowledge/src/ingestion-extraction.test.ts \
            packages/knowledge/src/ingestion-extraction.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/editorial/NodeEdgeProposalPanel.tsx \
            apps/web/src/components/AiIngestionExtractionPanel.tsx \
            apps/web/src/components/ExploreDiscuss.tsx \
            apps/web/src/components/LlmCredentialPanel.tsx \
            apps/web/src/lib/ai-ingestion-extraction.ts \
            apps/web/src/lib/llm-credential-token.test.ts \
            apps/web/src/lib/llm-credential-token.ts \
            apps/web/src/lib/llm-credentials.ts \
            packages/knowledge/src/graph-curation.test.ts \
            packages/knowledge/src/graph-curation.ts \
            packages/knowledge/src/ingestion-extraction.test.ts \
            packages/knowledge/src/ingestion-extraction.ts
          git commit -m "style(ai): apply repository formatting"
          git push
