name: Temporary credit-format report
on:
  push:
    branches:
      - feat/private-research-credit-foundation-20261018
permissions:
  contents: read
jobs:
  format-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print exact formatted file contents (temporary)
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/private-research-credit.md
            packages/contracts/src/private-research-credit.ts
            packages/contracts/src/private-research-credit.test.ts
            packages/knowledge/src/private-research-credit.ts
            packages/knowledge/src/private-research-credit.test.ts
            packages/knowledge/src/index.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for path in "${files[@]}"; do
            printf '### BEGIN FORMATTED %s\n' "$path"
            base64 -w0 "$path"
            printf '\n### END FORMATTED %s\n' "$path"
          done
