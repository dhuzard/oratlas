substitutions:
  _REGION: europe-west1
  _SERVICE: oratlas
  _RUNTIME_SERVICE_ACCOUNT: oratlas-runtime
  _AR_REPOSITORY: oratlas
  _CLOUD_SQL_INSTANCE: oratlas-postgres
  _DATABASE_URL_SECRET: oratlas-database-url
  _SESSION_SECRET: oratlas-session-secret
  _GITHUB_CLIENT_ID: ""
  _GITHUB_CLIENT_SECRET: oratlas-github-client-secret
  _GITHUB_TOKEN_SECRET: oratlas-github-token
  _ADMIN_GITHUB_USER_IDS: ""
  _NEXT_PUBLIC_BASE_URL: ""
  _BETA_SMOKE_QUERY: replay
  _BETA_SMOKE_INTEREST: data-code

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  - id: configure-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SERVICE}-migrate
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com
      - --command=pnpm
      - --args=db:deploy:postgres
      - --set-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_CLOUD_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest
      - --max-retries=0
      - --task-timeout=20m
      - --quiet

  - id: migrate-database
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SERVICE}-migrate
      - --region=${_REGION}
      - --wait
      - --quiet

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SECRETS="DATABASE_URL=${_DATABASE_URL_SECRET}:latest,SESSION_SECRET=${_SESSION_SECRET}:latest"
        if gcloud secrets describe "${_GITHUB_CLIENT_SECRET}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},GITHUB_CLIENT_SECRET=${_GITHUB_CLIENT_SECRET}:latest"
        fi
        if gcloud secrets describe "${_GITHUB_TOKEN_SECRET}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},GITHUB_TOKEN=${_GITHUB_TOKEN_SECRET}:latest"
        fi

        ENV_VARS="NODE_ENV=production"
        if [[ -n "${_GITHUB_CLIENT_ID}" ]]; then
          ENV_VARS="$${ENV_VARS},GITHUB_CLIENT_ID=${_GITHUB_CLIENT_ID}"
        fi
        if [[ -n "${_ADMIN_GITHUB_USER_IDS}" ]]; then
          ENV_VARS="$${ENV_VARS},ADMIN_GITHUB_USER_IDS=${_ADMIN_GITHUB_USER_IDS}"
        fi
        if [[ -n "${_NEXT_PUBLIC_BASE_URL}" ]]; then
          ENV_VARS="$${ENV_VARS},NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}"
        fi

        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE}:${BUILD_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com" \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory=1Gi \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=30 \
          --timeout=300 \
          --set-cloudsql-instances="${PROJECT_ID}:${_REGION}:${_CLOUD_SQL_INSTANCE}" \
          --set-env-vars="$${ENV_VARS}" \
          --set-secrets="$${SECRETS}" \
          --quiet

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --format='value(status.url)' > /workspace/oratlas-service-url

  - id: verify-beta-journey
    name: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE}:${BUILD_ID}
    entrypoint: bash
    env:
      - ORATLAS_BETA_SMOKE_QUERY=${_BETA_SMOKE_QUERY}
      - ORATLAS_BETA_SMOKE_INTEREST=${_BETA_SMOKE_INTEREST}
    args:
      - -ceu
      - |
        SERVICE_URL="$$(tr -d '\r\n' < /workspace/oratlas-service-url)"
        cd /app
        node scripts/smoke-gcp-beta.mjs "$${SERVICE_URL}" \
          --query "$${ORATLAS_BETA_SMOKE_QUERY}" \
          --interest "$${ORATLAS_BETA_SMOKE_INTEREST}"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE}:${BUILD_ID}
